<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PianoKids">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>PianoKids</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e1a;color:#f0f4ff;min-height:100vh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#131929;border-bottom:1px solid #1e2d4a;padding-top:calc(14px + env(safe-area-inset-top))}
.logo{font-size:20px;font-weight:900;letter-spacing:-0.5px;color:#f9c23c}
.logo span{color:#f0f4ff}
.streak{font-size:12px;font-weight:700;color:#f97316;background:#1c1200;border:1px solid #78350f;padding:3px 10px;border-radius:20px}
.mic-section{margin:14px 14px 0;background:#131929;border:1px solid #1e2d4a;border-radius:16px;overflow:hidden}
.mic-top{display:flex;align-items:center;gap:12px;padding:14px}
.mic-orb{width:60px;height:60px;border-radius:50%;background:#0a0e1a;border:2px solid #1e2d4a;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0;position:relative}
.mic-orb.listening{border-color:#f9c23c;background:#1a1400}
.mic-orb.listening .orb-ring{animation:orbpulse 1.2s ease-in-out infinite}
.orb-ring{position:absolute;inset:-7px;border-radius:50%;border:2px solid #f9c23c22;transition:.2s}
.mic-svg{width:24px;height:24px;stroke:#8899bb;fill:none;stroke-width:2;stroke-linecap:round}
.mic-orb.listening .mic-svg{stroke:#f9c23c}
@keyframes orbpulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.18);opacity:1}}
.mic-info{flex:1}
.mic-status{font-size:15px;font-weight:800;color:#f0f4ff}
.mic-sub{font-size:11px;color:#8899bb;margin-top:2px}
.mic-toggle{padding:8px 16px;border-radius:10px;border:1px solid #2a3a58;background:transparent;color:#f0f4ff;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;-webkit-tap-highlight-color:transparent}
.mic-toggle.on{background:#f9c23c;border-color:#f9c23c;color:#1a1000}
.vol-bar-wrap{height:5px;background:#0a0e1a;margin:0 14px 14px}
.vol-bar{height:100%;border-radius:3px;background:#f9c23c;width:0%;transition:width .05s}
.detected-note{margin:10px 14px;border-radius:12px;border:1px solid #1e2d4a;background:#0a0e1a;padding:14px;display:flex;align-items:center;gap:14px}
.note-big{font-size:48px;font-weight:900;min-width:64px;text-align:center;line-height:1;color:#f9c23c;font-family:'Georgia',serif}
.note-detail{flex:1}
.note-freq{font-size:11px;color:#8899bb;margin-top:2px}
.conf-bar{height:4px;background:#1e2d4a;border-radius:2px;margin-top:8px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;background:#4ade80;transition:width .15s}
.note-match{font-size:13px;font-weight:800;padding:5px 12px;border-radius:10px;align-self:center;white-space:nowrap}
.note-match.correct{background:#14532d33;color:#4ade80;border:1px solid #14532d}
.note-match.wrong{background:#450a0a33;color:#f87171;border:1px solid #450a0a}
.note-match.waiting{background:#1e2d4a;color:#8899bb;border:1px solid #2a3a58}
.lesson-section{margin:0 14px;background:#131929;border:1px solid #1e2d4a;border-radius:16px;overflow:hidden}
.lesson-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #1e2d4a}
.lesson-title{font-size:14px;font-weight:800}
.lesson-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;background:#1a1600;color:#f9c23c;border:1px solid #78350f}
.scrolling-notes{position:relative;height:100px;overflow:hidden;background:#0d1220}
.staff-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.playhead-line{position:absolute;left:80px;top:0;bottom:0;width:2px;background:#f9c23c;opacity:.9}
.notes-row{position:absolute;top:50%;transform:translateY(-50%);left:0;display:flex;align-items:center;padding-left:16px}
.note-pill{display:flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:8px;font-size:12px;font-weight:900;flex-shrink:0;margin:0 4px;border:1px solid transparent}
.note-pill.future{background:#1a2235;color:#4d5f82;border-color:#1e2d4a}
.note-pill.current{background:#f9c23c;color:#1a1000;border-color:#f9c23c}
.note-pill.done-ok{background:#14532d;color:#4ade80;border-color:#166534}
.note-pill.done-fail{background:#450a0a;color:#f87171;border-color:#7f1d1d}
.wait-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #1e2d4a}
.wdot{width:8px;height:8px;border-radius:50%;background:#4ecdc4;flex-shrink:0;animation:wpulse 1.1s infinite}
@keyframes wpulse{0%,100%{opacity:1}50%{opacity:.2}}
.wlabel{font-size:12px;color:#8899bb;font-weight:600}
.wtarget{margin-left:auto;font-size:16px;font-weight:900;color:#f9c23c;letter-spacing:.5px}
.controls-row{display:flex;align-items:center;padding:10px 14px;border-top:1px solid #1e2d4a;gap:8px;flex-wrap:wrap}
.ctrl-sm{padding:7px 14px;border-radius:10px;background:#0a0e1a;border:1px solid #1e2d4a;color:#f0f4ff;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;-webkit-tap-highlight-color:transparent}
.ctrl-sm.active{border-color:#a78bfa;color:#a78bfa;background:#1a0e30}
.speed-row{display:flex;align-items:center;gap:8px;flex:1;min-width:120px}
.speed-row label{font-size:11px;color:#8899bb;white-space:nowrap}
.speed-row input{flex:1;accent-color:#a78bfa}
.speed-val{font-size:11px;font-weight:800;color:#a78bfa;min-width:30px}
.piano-guide{margin:10px 14px 0;background:#131929;border:1px solid #1e2d4a;border-radius:12px;padding:12px}
.pg-title{font-size:11px;font-weight:700;color:#8899bb;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pg-keys-wrap{position:relative;height:60px}
.pg-whites{display:flex;gap:1px;height:60px}
.pg-white{flex:1;background:#f8f9ff;border-radius:0 0 6px 6px;border:1px solid #c8ccd8;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;position:relative;transition:.15s}
.pg-white.lit{background:#f9c23c;border-color:#d97706}
.pg-white.heard{background:#4ade80;border-color:#166534}
.pg-white span{font-size:8px;font-weight:800;color:#8899bb;pointer-events:none}
.pg-white.lit span{color:#92400e}
.pg-white.heard span{color:#14532d}
.pg-blacks{position:absolute;top:0;left:0;right:0;height:36px;pointer-events:none}
.pg-black{position:absolute;height:36px;border-radius:0 0 4px 4px;background:#1a1f2e;border:1px solid #2a3550;transition:.15s}
.pg-black.lit{background:#d97706}
.pg-black.heard{background:#166534}
.song-picker{margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.song-card{background:#131929;border:1px solid #1e2d4a;border-radius:12px;padding:12px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.song-card.active{border-color:#f9c23c;background:#1a1600}
.sc-emoji{font-size:22px;margin-bottom:6px}
.sc-name{font-size:12px;font-weight:800;color:#f0f4ff}
.sc-diff{font-size:10px;font-weight:700;margin-top:3px}
.diff-e{color:#4ade80}.diff-m{color:#fb923c}.diff-h{color:#f87171}
.score-row{display:flex;gap:8px;margin:10px 14px 16px}
.score-card{flex:1;background:#131929;border:1px solid #1e2d4a;border-radius:10px;padding:10px;text-align:center}
.sc-val{font-size:22px;font-weight:900;font-family:'Georgia',serif}
.sc-lbl{font-size:9px;font-weight:700;color:#8899bb;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.feedback-toast{position:fixed;top:40%;left:50%;transform:translateX(-50%) scale(0);background:#4ade80;color:#052e16;padding:12px 28px;border-radius:16px;font-size:22px;font-weight:900;z-index:50;pointer-events:none;transition:transform .15s,opacity .2s;white-space:nowrap}
.feedback-toast.show{transform:translateX(-50%) scale(1)}
.feedback-toast.wrong{background:#f87171;color:#450a0a}
</style>
</head>
<body>
<div class="app">
<div class="feedback-toast" id="toast">✓ Perfect!</div>

<div class="hdr">
  <div class="logo">🎹 Piano<span>Kids</span></div>
  <div class="streak">🔥 7 day streak</div>
</div>

<div class="mic-section">
  <div class="mic-top">
    <div class="mic-orb" id="micOrb" onclick="toggleMic()">
      <div class="orb-ring"></div>
      <svg class="mic-svg" viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 11c0 3.866 3.134 7 7 7s7-3.134 7-7"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
    </div>
    <div class="mic-info">
      <div class="mic-status" id="micStatus">Microphone Off</div>
      <div class="mic-sub" id="micSub">Tap to start listening to your piano</div>
    </div>
    <button class="mic-toggle" id="micToggle" onclick="toggleMic()">Start</button>
  </div>
  <div class="vol-bar-wrap"><div class="vol-bar" id="volBar"></div></div>
</div>

<div class="detected-note">
  <div class="note-big" id="detectedNote">—</div>
  <div class="note-detail">
    <div style="font-size:13px;font-weight:700;color:#f0f4ff" id="noteFullName">Waiting for a note...</div>
    <div class="note-freq" id="noteFreq">— Hz</div>
    <div class="conf-bar"><div class="conf-fill" id="confFill" style="width:0%"></div></div>
  </div>
  <div class="note-match waiting" id="noteMatch">—</div>
</div>

<div class="lesson-section">
  <div class="lesson-hdr">
    <div class="lesson-title" id="lessonTitle">Twinkle Twinkle Little Star</div>
    <div class="lesson-badge" id="waitBadge">WAIT MODE</div>
  </div>
  <div class="scrolling-notes">
    <svg class="staff-svg" viewBox="0 0 400 100" preserveAspectRatio="none">
      <line x1="0" y1="18" x2="400" y2="18" stroke="#1e2d4a" stroke-width="1"/>
      <line x1="0" y1="34" x2="400" y2="34" stroke="#1e2d4a" stroke-width="1"/>
      <line x1="0" y1="50" x2="400" y2="50" stroke="#1e2d4a" stroke-width="1"/>
      <line x1="0" y1="66" x2="400" y2="66" stroke="#1e2d4a" stroke-width="1"/>
      <line x1="0" y1="82" x2="400" y2="82" stroke="#1e2d4a" stroke-width="1"/>
    </svg>
    <div class="playhead-line"></div>
    <div class="notes-row" id="notesRow"></div>
  </div>
  <div class="wait-row">
    <div class="wdot"></div>
    <div class="wlabel">Play this note on your piano</div>
    <div class="wtarget" id="targetNoteLabel">C4</div>
  </div>
  <div class="controls-row">
    <button class="ctrl-sm active" id="waitBtn" onclick="toggleWait()">Wait Mode</button>
    <button class="ctrl-sm" id="loopBtn" onclick="toggleLoop()">Loop</button>
    <div class="speed-row">
      <label>Speed</label>
      <input type="range" min="25" max="100" value="75" step="5" id="speedSlider" oninput="updateSpeed(this.value)">
      <span class="speed-val" id="speedVal">75%</span>
    </div>
  </div>
</div>

<div class="piano-guide">
  <div class="pg-title">Key to play next</div>
  <div class="pg-keys-wrap" id="pgKeysWrap"></div>
</div>

<div class="song-picker" id="songPicker"></div>

<div class="score-row">
  <div class="score-card"><div class="sc-val" style="color:#4ade80" id="scCorrect">0</div><div class="sc-lbl">Correct</div></div>
  <div class="score-card"><div class="sc-val" style="color:#f87171" id="scWrong">0</div><div class="sc-lbl">Missed</div></div>
  <div class="score-card"><div class="sc-val" style="color:#f9c23c" id="scAcc">—</div><div class="sc-lbl">Accuracy</div></div>
  <div class="score-card"><div class="sc-val" style="color:#a78bfa" id="scStreak">0</div><div class="sc-lbl">Streak</div></div>
</div>

</div>
<script>
const SONGS=[
  {name:"Twinkle Twinkle",emoji:"⭐",diff:"easy",notes:["C4","C4","G4","G4","A4","A4","G4","F4","F4","E4","E4","D4","D4","C4","G4","G4","F4","F4","E4","E4","D4"]},
  {name:"Mary's Lamb",emoji:"🐑",diff:"easy",notes:["E4","D4","C4","D4","E4","E4","E4","D4","D4","D4","E4","G4","G4","E4","D4","C4","D4","E4","E4","E4","E4","D4","D4","E4","D4","C4"]},
  {name:"Ode to Joy",emoji:"🎻",diff:"medium",notes:["E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","E4","D4","D4","E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","D4","C4","C4"]},
  {name:"Fur Elise",emoji:"🌹",diff:"hard",notes:["E5","D#5","E5","D#5","E5","B4","D5","C5","A4","C4","E4","A4","B4","E4","G#4","B4","C5","E4","E5","D#5","E5","D#5","E5","B4","D5","C5","A4"]},
];
const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const WHITE_SEQ=["C3","D3","E3","F3","G3","A3","B3","C4","D4","E4","F4","G4","A4","B4","C5","D5","E5"];
const BLACK_DEFS=[{note:"C#3",after:0},{note:"D#3",after:1},{note:"F#3",after:3},{note:"G#3",after:4},{note:"A#3",after:5},{note:"C#4",after:7},{note:"D#4",after:8},{note:"F#4",after:10},{note:"G#4",after:11},{note:"A#4",after:12},{note:"C#5",after:14},{note:"D#5",after:15}];
let micActive=false,audioCtx=null,analyser=null,micStream=null,rafId=null;
let currentSong=SONGS[0],noteIdx=0,waitMode=true,loopMode=false,speed=75;
let correctCount=0,wrongCount=0,streakCount=0;
let lastDetected="",lastDetectedTime=0;

function freqToNote(f){
  if(f<60||f>2000)return null;
  const n=Math.round(12*Math.log2(f/440))+69;
  const oct=Math.floor(n/12)-1;
  return NOTE_NAMES[((n%12)+12)%12]+oct;
}
function autoCorrelate(buf,sr){
  let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);if(rms<0.01)return -1;
  let r1=0,r2=buf.length-1;
  for(let i=0;i<buf.length/2;i++){if(Math.abs(buf[i])<0.2){r1=i;break;}}
  for(let i=1;i<buf.length/2;i++){if(Math.abs(buf[buf.length-i])<0.2){r2=buf.length-i;break;}}
  const b=buf.slice(r1,r2);
  const c=new Float32Array(b.length*2);
  for(let i=0;i<b.length;i++)for(let j=0;j<b.length;j++)c[i+j]+=b[i]*b[j];
  const c2=c.slice(b.length);
  let d=0;while(c2[d]>c2[d+1])d++;
  let mv=-1,mp=-1;
  for(let i=d;i<c2.length;i++){if(c2[i]>mv){mv=c2[i];mp=i;}}
  if(mp<=0)return -1;
  const x1=c2[mp-1],x2=c2[mp],x3=c2[mp+1];
  const T=mp+(x3-x1)/(2*(2*x2-x1-x3));
  return sr/T;
}
async function toggleMic(){
  if(micActive){stopMic();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    micStream=stream;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    micActive=true;
    document.getElementById("micOrb").classList.add("listening");
    document.getElementById("micToggle").textContent="Stop";
    document.getElementById("micToggle").classList.add("on");
    document.getElementById("micStatus").textContent="Listening...";
    document.getElementById("micSub").textContent="Play a note on your piano";
    listenLoop();
  }catch(e){
    document.getElementById("micStatus").textContent="Mic access denied";
    document.getElementById("micSub").textContent="Allow microphone in iPad Settings > Safari";
  }
}
function stopMic(){
  micActive=false;if(rafId)cancelAnimationFrame(rafId);
  if(micStream)micStream.getTracks().forEach(t=>t.stop());
  if(audioCtx)audioCtx.close();
  document.getElementById("micOrb").classList.remove("listening");
  document.getElementById("micToggle").textContent="Start";
  document.getElementById("micToggle").classList.remove("on");
  document.getElementById("micStatus").textContent="Microphone Off";
  document.getElementById("micSub").textContent="Tap to start listening to your piano";
  document.getElementById("volBar").style.width="0%";
  document.getElementById("detectedNote").textContent="—";
  document.getElementById("noteFreq").textContent="— Hz";
  document.getElementById("confFill").style.width="0%";
  setNoteMatch("waiting","—");
}
function listenLoop(){
  if(!micActive)return;
  const buf=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  const vol=Math.min(100,Math.round(rms*400));
  document.getElementById("volBar").style.width=vol+"%";
  const freq=autoCorrelate(buf,audioCtx.sampleRate);
  if(freq>0){
    const note=freqToNote(freq);
    if(note){
      const conf=Math.min(100,Math.round(vol*3));
      document.getElementById("detectedNote").textContent=note.replace(/\d/,"");
      document.getElementById("noteFullName").textContent=noteName(note)+" ("+note+")";
      document.getElementById("noteFreq").textContent=Math.round(freq)+" Hz";
      document.getElementById("confFill").style.width=conf+"%";
      highlightHeardKey(note);
      const target=currentSong.notes[noteIdx];
      if(note===target){
        setNoteMatch("correct","✓ Match");
        if(note!==lastDetected||Date.now()-lastDetectedTime>350){
          lastDetected=note;lastDetectedTime=Date.now();
          onCorrect();
        }
      } else {
        setNoteMatch("wrong","✗ "+note);lastDetected="";
      }
    }
  } else {lastDetected="";}
  rafId=requestAnimationFrame(listenLoop);
}
function setNoteMatch(cls,txt){
  const el=document.getElementById("noteMatch");
  el.className="note-match "+cls;el.textContent=txt;
}
function noteName(n){
  const m={"C":"C (Do)","C#":"C# (Do#)","D":"D (Re)","D#":"D# (Re#)","E":"E (Mi)","F":"F (Fa)","F#":"F# (Fa#)","G":"G (Sol)","G#":"G# (Sol#)","A":"A (La)","A#":"A# (La#)","B":"B (Ti)"};
  return m[n.replace(/\d/,"")]||n.replace(/\d/,"");
}
function onCorrect(){
  correctCount++;streakCount++;
  document.getElementById("scCorrect").textContent=correctCount;
  document.getElementById("scStreak").textContent=streakCount;
  updateAcc();showToast("✓ Perfect!",false);advanceNote();
}
function advanceNote(){
  if(noteIdx<currentSong.notes.length-1){noteIdx++;}
  else{if(loopMode){noteIdx=0;}else{showToast("🎉 Song complete!",false);noteIdx=0;}}
  updateLesson();
}
function updateLesson(){
  const notes=currentSong.notes;
  const row=document.getElementById("notesRow");row.innerHTML="";
  const offset=Math.max(0,noteIdx-2);
  for(let i=offset;i<Math.min(offset+8,notes.length);i++){
    const p=document.createElement("div");
    p.className="note-pill "+(i<noteIdx?"done-ok":i===noteIdx?"current":"future");
    p.textContent=notes[i].replace(/\d/,"");row.appendChild(p);
  }
  document.getElementById("targetNoteLabel").textContent=notes[noteIdx]||"—";
  highlightTargetKey(notes[noteIdx]);
}
let toastTimer=null;
function showToast(msg,wrong){
  const t=document.getElementById("toast");t.textContent=msg;
  t.classList.toggle("wrong",wrong);t.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),900);
}
function updateAcc(){
  const total=correctCount+wrongCount;
  document.getElementById("scWrong").textContent=wrongCount;
  document.getElementById("scAcc").textContent=total?Math.round(correctCount/total*100)+"%":"—";
}
function toggleWait(){waitMode=!waitMode;document.getElementById("waitBtn").classList.toggle("active",waitMode);document.getElementById("waitBadge").style.opacity=waitMode?"1":"0.3";}
function toggleLoop(){loopMode=!loopMode;document.getElementById("loopBtn").classList.toggle("active",loopMode);}
function updateSpeed(v){speed=parseInt(v);document.getElementById("speedVal").textContent=speed+"%";}
function buildSongPicker(){
  const c=document.getElementById("songPicker");c.innerHTML="";
  SONGS.forEach((s,i)=>{
    const card=document.createElement("div");
    card.className="song-card"+(i===0?" active":"");
    card.innerHTML=`<div class="sc-emoji">${s.emoji}</div><div class="sc-name">${s.name}</div><div class="sc-diff diff-${s.diff[0]}">${s.diff}</div>`;
    card.onclick=()=>{
      document.querySelectorAll(".song-card").forEach(c=>c.classList.remove("active"));
      card.classList.add("active");currentSong=s;noteIdx=0;
      correctCount=0;wrongCount=0;streakCount=0;
      ["scCorrect","scWrong","scStreak"].forEach(id=>document.getElementById(id).textContent="0");
      document.getElementById("scAcc").textContent="—";
      document.getElementById("lessonTitle").textContent=s.name;
      updateLesson();
    };
    c.appendChild(card);
  });
}
function buildPianoGuide(){
  const wrap=document.getElementById("pgKeysWrap");wrap.innerHTML="";
  const whites=document.createElement("div");whites.className="pg-whites";
  WHITE_SEQ.forEach(n=>{
    const k=document.createElement("div");k.className="pg-white";k.id="pgw-"+n.replace("#","s");
    k.innerHTML=`<span>${n.replace(/\d/,"")}</span>`;whites.appendChild(k);
  });
  wrap.appendChild(whites);
  const bDiv=document.createElement("div");bDiv.className="pg-blacks";
  const wCount=WHITE_SEQ.length;
  BLACK_DEFS.forEach(b=>{
    const k=document.createElement("div");k.className="pg-black";k.id="pgb-"+b.note.replace("#","s");
    const leftPct=((b.after+1)/wCount*100);
    k.style.cssText=`left:calc(${leftPct}% - ${5}px);width:${1/wCount*100*0.7}%;min-width:8px;`;
    bDiv.appendChild(k);
  });
  wrap.appendChild(bDiv);
}
function clearPianoKeys(cls){document.querySelectorAll(".pg-white."+cls+",.pg-black."+cls).forEach(k=>k.classList.remove(cls));}
function highlightTargetKey(note){
  clearPianoKeys("lit");if(!note)return;
  const id="pg"+(note.includes("#")?"b-":"w-")+note.replace("#","s");
  const el=document.getElementById(id);if(el)el.classList.add("lit");
}
function highlightHeardKey(note){
  clearPianoKeys("heard");if(!note)return;
  const id="pg"+(note.includes("#")?"b-":"w-")+note.replace("#","s");
  const el=document.getElementById(id);if(el)el.classList.add("heard");
}
buildSongPicker();buildPianoGuide();updateLesson();
</script>
